<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Autoplay Music Button</title>

<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

<style>
  body {
    height: 200vh;
    background: #0a0a0a;
  }

  .music-btn {
    position: fixed;
    top: 18px;
    right: 18px;
    width: 44px;
    height: 44px;
    background: #ff5500;
    border: 4px solid #000;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 9999;
    box-shadow: 4px 4px 0 #000;
    overflow: hidden;
  }

  .music-btn i {
    font-size: 18px;
    color: #000;
    z-index: 2;
  }

  /* Pulse when playing */
  .music-btn.playing::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: rgba(0,0,0,0.25);
    animation: pulse 1.4s infinite;
  }

  @keyframes pulse {
    0% { transform: scale(0.6); opacity: 0.6; }
    100% { transform: scale(1.4); opacity: 0; }
  }
</style>
</head>

<body>

<!-- MUSIC BUTTON -->
<div id="musicToggle" class="music-btn">
  <i id="musicIcon" class="fas fa-volume-mute"></i>
</div>

<!-- AUDIO (AUTOPLAY MUTED) -->
<audio id="bgMusic" autoplay muted loop preload="auto">
  <source src="MEDIA/bg.mp3" type="audio/mpeg">
</audio>

<script>
  const music = document.getElementById("bgMusic");
  const btn = document.getElementById("musicToggle");
  const icon = document.getElementById("musicIcon");

  // Volume preset
  music.volume = 0.5;

  // Toggle mute / play
  btn.addEventListener("click", () => {
    if (music.muted) {
      music.muted = false;
      music.play();
      btn.classList.add("playing");
      icon.className = "fas fa-volume-up";
    } else {
      music.muted = true;
      btn.classList.remove("playing");
      icon.className = "fas fa-volume-mute";
    }
  });
</script>

</body>
</html>
